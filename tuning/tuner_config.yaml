# ============================================================================
# AI controller tuning config (Optuna BO, closed-loop in sim)
#
# stage 1 = solo racing (lap time + tracking + oscillation).
# Params with enabled: true are optimized; the rest are listed with bounds so
# later stages just flip the flags. NEVER enable AEB_thres (safety) or KI
# (integrator windup - keep 0).
# ============================================================================

study:
  # v3: lateral-control refinements joined the search - chord-error L1 cap
  # (l1_chord_err) + parameterized lat-err steer amplifier. Both ranges
  # CONTAIN the legacy behaviour (cap ~1.0 = off, coeff 0.693 = ln2), so the
  # optimizer itself decides whether the new mechanisms earn their keep.
  # v2 ended at lap 8.2s: scaling saturated at ~1.58 because corner-entry
  # L1 collapse limited tracking - exactly what the cap addresses.
  # v1/v2 history stays in this same DB under their study names.
  # v3c: oscillation weights doubled+ (w_osc 4->8, w_weave 100->250) for
  # real-car safety - fresh name so v3b's 91 trials (cheaper weave) don't
  # contaminate the ranking. History: v3 (no weave) -> v3b (weave 100).
  # v4 2026-07-23: sim watch showed the search still trading oscillation for
  # lap time -> both oscillation weights x4 (w_osc 8->32, w_weave 250->1000).
  # Fresh name again; v3c history stays in the DB.
  # v5 2026-07-23: v4 top-10 still ranked by lap (d-weave spread cost ~0.3 vs
  # lap spread ~0.4s) -> x2 more (w_osc 64, w_weave 2000): smoothness first,
  # then fastest within it. NOT more than this - overweighting makes "drive
  # slow" the cheapest smoothness and the search collapses to low scaling.
  name: controller_stage1_v5
  storage: sqlite:////home/ajm/unicorn_ws/tuning/optuna_stage1.db
  n_trials: 60                 # per invocation; study resumes from storage

run:
  node_name: /controller_manager
  odom_frenet_topic: /car_state/odom_frenet
  drive_topic: /vesc/high_level/ackermann_cmd
  global_wpnts_topic: /global_waypoints
  # full stack remaps the gym reset topic: /initialpose -> /sim/initialpose
  # (gym_bridge_launch.py); RViz's raw /initialpose does NOT reach the bridge.
  initialpose_topic: /sim/initialpose
  laps_per_trial: 2            # measured laps (excl. standing-start warmup lap)
  settle_after_reset_s: 1.0
  max_lap_time_s: 60.0         # per-lap watchdog; also scales warmup timeout
  stuck_window_s: 4.0          # no s-progress for this long -> trial failed
  stuck_min_progress_m: 0.3
  offtrack_d_max_m: 0.7        # |d| beyond this = off raceline corridor -> fail

objective:
  w_lat_err: 4.0               # cost per meter of mean |d| (below the budget)
  d_hard_limit: 0.10           # lateral-error budget [m]: mean |d| beyond this...
  w_d_over: 200.0              # ...costs this much per meter -> prohibitive
  # oscillation weights raised 2026-07-23: x2, x4 (v4), then x2 again (v5) -
  # each bump halved best weave; v5 makes smoothness rank-dominant in the top.
  w_osc: 64.0                  # cost per rad RMS of per-cycle steering delta
  w_weave: 2000.0              # cost per m RMS of per-sample SIGNED d increment
                               # (body sway; clean ~0.002 -> +4.0,
                               #  5 cm @ 2 Hz weave ~0.009 -> +18 = prohibitive)
  # v7c 2026-07-25: WORST-CORNER oscillation penalties. The whole-lap RMS above
  # averaged a single oscillating corner (left C, L1-collapse) away, so the
  # optimizer happily picked high curvature_factor. These score the worst ~1 s
  # window, forcing every corner smooth (user found curvature_factor 0.02 fixes
  # it by hand; this makes the tuner discover that class of fix itself).
  w_osc_worst: 40.0            # cost per rad of worst-window steer-delta RMS
  w_weave_worst: 600.0         # cost per m of worst-window d-increment RMS
  fail_penalty: 120.0          # base cost for crash/stuck/offtrack/timeout
  progress_bonus: 5.0          # subtracted x (progress fraction) on failure

# ---------------------------------------------------------------------------
# stage 1a v2: L1 geometry + corner speed + SPEED-PROFILE SCALE (ON)
# Bounds re-centered on the v1 top-10 region; bounds v1 pinned (q_l1 high,
# t_clip_min high, speed_factor_for_lat_err low) are opened up.
# "/node:param" syntax targets that node instead of the controller.
# ---------------------------------------------------------------------------
params:
  # v7: widened to CONTAIN the car's proven PP values (m_l1 0.8, q_l1 -0.2)
  # which sat outside the old bounds; the new-physics optimum may live there.
  m_l1:                      {enabled: true,  low: 0.35, high: 1.00}
  q_l1:                      {enabled: true,  low: -0.30, high: 1.00}
  t_clip_min:                {enabled: true,  low: 0.60, high: 2.50}
  t_clip_max:                {enabled: true,  low: 3.00, high: 8.00}
  curvature_factor:          {enabled: true,  low: 0.00, high: 0.25}
  speed_lookahead:           {enabled: true,  low: 0.10, high: 0.40}
  speed_factor_for_lat_err:  {enabled: true,  low: 0.20, high: 2.00}
  speed_factor_for_curvature: {enabled: true, low: 0.30, high: 2.00}
  # raceline speed-profile multiplier: the ONLY knob that raises the lap-time
  # ceiling. Optimizer pushes it up until tracking breaks (crash/offtrack/
  # d-budget penalties push back) -> finds the car+controller's true limit.
  # step 0.01: sector_tuner declares this param with a 0.01-step range and
  # rejects finer values.
  # high=2.0: v2 run pinned at the old 1.6 bound (top10 all 1.54-1.60);
  # 2.0 is the sector_tuner descriptor ceiling, so this is as far as it opens.
  # v7b 2026-07-25: scaling FROZEN at 1.0 (see frozen: below) - user fixes the
  # speed profile and tunes only the L1/steer geometry against it.
  "/speed_sector_tuner:Sector0.scaling": {enabled: false, low: 1.00, high: 2.00, step: 0.01}
  # v3 refinements - ranges include "off" so the search subsumes v2 behaviour:
  # l1_chord_err 1.0 ~ cap disabled; lat_err_steer_coeff 0.6931 = legacy ln2.
  l1_chord_err:              {enabled: true,  low: 0.05, high: 1.00}
  lat_err_steer_coeff:       {enabled: true,  low: 0.00, high: 0.70}

  # stage 1b scalers - enabled 2026-07-23 (fast_v3): with scaling ~1.6 the car
  # lives in the 6.5-10 m/s downscale band, so these directly drive high-speed
  # deviation/oscillation. start/end_scale_speed stay fixed (band anchor) to
  # save dimensions.
  lat_err_coeff:             {enabled: true,  low: 0.50, high: 1.00}
  acc_scaler_for_steer:      {enabled: true,  low: 0.80, high: 1.30}
  dec_scaler_for_steer:      {enabled: true,  low: 0.80, high: 1.30}
  # band anchor: NOT searched and now pinned explicitly in frozen: below, so a
  # yaml edit / ctrl-save / --show-best write can't drift it out from under a
  # study (2026-07-25). Ablation at scaling 1.0: re-centring the band to 5.0-9.0
  # cost +0.27 and only fed weave - the 6.5/10.0 anchor stays.
  start_scale_speed:         {enabled: false, low: 4.00, high: 8.00}
  end_scale_speed:           {enabled: false, low: 7.00, high: 12.00}
  downscale_factor:          {enabled: true,  low: 0.00, high: 0.80}
  speed_lookahead_for_steer: {enabled: true,  low: 0.00, high: 0.30}
  steer_gain_for_speed:      {enabled: false, low: 1.00, high: 1.50}
  future_constant:           {enabled: true,  low: 0.00, high: 0.15}
  # heading P(+D) trim: searched, not frozen - if the geometric control truly
  # needs no trim, the optimizer converges these to ~0 by itself.
  # KI stays frozen at 0 (unbounded integral, structural windup risk).
  # 2026-07-23: widened 0.6 -> 1.2 (fast_v1 best sat pinned at 0.6);
  # applied in study controller_fast_v2 (user-approved restart).
  KP:                        {enabled: true,  low: 0.00, high: 1.20}
  KD:                        {enabled: true,  low: 0.00, high: 0.12}
  heading_error_thres:       {enabled: false, low: 5.00, high: 20.00}

  # stage 2 (TRAILING; needs opponent scenario + gap-error objective)
  trailing_gap:              {enabled: false, low: 1.00, high: 4.00}
  trailing_vel_gain:         {enabled: false, low: 0.00, high: 0.60}
  trailing_p_gain:           {enabled: false, low: 0.30, high: 3.00}
  trailing_d_gain:           {enabled: false, low: 0.00, high: 2.00}
  blind_trailing_speed:      {enabled: false, low: 0.50, high: 3.00}

  # stage 4 (START state; one-shot launch scenario)
  start_speed:               {enabled: false, low: 4.00, high: 12.00}
  speed_diff_thres:          {enabled: false, low: 0.02, high: 0.30}
  start_curvature_factor:    {enabled: false, low: 0.50, high: 3.00}

  # excluded on purpose: AEB_thres (safety), KI (windup - keep 0),
  # trailing_i_gain (windup), ftg_* (stage 3, separate objective/scenario)

# values pinned during this study (applied every trial, not optimized).
# Use this to freeze stage-1a results while tuning 1b.
frozen:
  # sector_tuner clips Sector0.scaling to global_limit (yaml default 1.2);
  # raise it so the scaling search space [0.9, 1.6] is actually reachable.
  "/speed_sector_tuner:global_limit": 2.0
  # v7b: speed profile fixed at 1.0 (not searched) - tune geometry only.
  "/speed_sector_tuner:Sector0.scaling": 1.0
  # KI only: KP/KD are search dimensions now; KI stays off (windup risk, and
  # controller.yaml still carries an old nonzero value).
  KI: 0.0
  # steer-downscale band anchor, pinned at the current yaml values (both
  # controller.yaml and controller_map.yaml carry 6.5 / 10.0). Not searched;
  # spelled out here so every trial gets the same band no matter what the
  # controller yamls drift to. downscale_factor (the magnitude) stays searched.
  start_scale_speed: 6.5
  end_scale_speed: 10.0
