/**:
  ros__parameters:
    wheelbase: 0.33
    scan_topic: 'scan'
    odometry_topic: 'vesc/odom'

urg_node:
  ros__parameters:
    angle_max: 3.14
    angle_min: -3.14
    ip_address: "192.168.0.10"
    ip_port: 10940
    laser_frame_id: "laser"
    calibrate_time: false
    default_user_latency: 0.0
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    publish_intensity: true
    publish_multiecho: false
    cluster: 1
    skip: 0

vesc/**:
  ros__parameters:
    port: "/dev/ttyACM0"
    publish_tf: false
    brake_max: 200000.0
    brake_min: -20000.0
    current_max: 100.0
    current_min: 0.0
    duty_cycle_max: 0.0
    duty_cycle_min: 0.0
    position_max: 0.0
    position_min: 0.0
    servo_max: 1.0 #0.88497
    servo_min: 0.0 #0.08497
    speed_max: 45968.0  #23250
    speed_min: -45968.0
    #이론적인 07.07 erpm: 2873.0
    #수정 전 speed_to_erpm_gain: 2840.0
    speed_to_erpm_gain: 2873.0 #0716 2873.0 #0717 erpm 게인 수정, 본인 속도를 빠르다 생각해서 게인 높여줌, 그 결과 고속에서 로컬라이제이션 시 선속도 일치하게 됨
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: 0.51
    #수정 전 steering_angle_to_servo_offset: 0.475 오른쪽으로 가는 경향이 심했음 0.48497
    steering_angle_to_servo_offset: 0.5  #0.49
    #07.15 수정 0.47875 
    # 0.4775 좌 
    # 0.47875살짝살짝좌라면-> 0.479375로 바꾸기
    # 0.47875살짝살짝우라면-> 0.478125  바꾸기
    # 0.48 우
    use_servo_cmd_to_calc_angular_velocity: true
    # Adaptive wheel odometry (vesc_to_odom_node):
    # adaptive_gain = speed_to_erpm_gain + gain_offset + acceleration_gain * filtered_ax
    # acceleration_gain/gain_offset = 0 이면 기존 고정 gain과 동일. IMU 축/부호를
    # 실차에서 확인한 뒤(전진 가속 시 /vesc/sensors/imu linear_acceleration.x > 0)
    # acceleration_gain을 작은 값부터 튜닝할 것.
    adaptive_odom:
      enabled: true
      acceleration_gain: 50.0
      gain_offset: 0.0
      low_pass_filter_alpha: 0.1
      minimum_gain: 1500.0
      maximum_abs_acceleration: 10.0
      imu_timeout: 0.5
