ekf_localization:
  ros__parameters:

    frequency     : 100.0
    sensor_timeout: 0.1
    two_d_mode    : true
    publish_tf    : true  # Cartographer already publishes map→odom TF

    odom_frame     : base_link
    base_link_frame: base_link
    world_frame    : map        # absolute pose in map frame

    # VESC wheel odometry: use longitudinal velocity only (vx)
    odom0: /vesc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # VESC IMU: use yaw rate (gyro z) instead of the steering-model yaw rate
    # published by /vesc/odom.
    imu0: /vesc/sensors/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true, false, false]
    imu0_differential: false

    # Cartographer tracked pose (converted PoseStamped → Odometry): use position + yaw
    odom1: /tracked_pose/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false

    # VESC IMU: yaw rate (gyro z) only, replaces vesc_odom's kinematic vyaw.
    imu0: /vesc/sensors/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10

# 순서 x,y,z
    # roll,pitch,yaw
    # vx,vy,vz
    # vroll,vpitch,vyaw
    # ax,ay,az