bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: ''
    ego_scan_topic: 'scan'
    ego_odom_topic: 'car_state/odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'vesc/ackermann_cmd'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.27

    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 2160

    # map parameters
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 1

    # ego starting pose on map — raceline point at s=1.1 m of stack_master/maps/s.
    # Deliberately PAST the start line: spawning exactly at s=0 makes the parked
    # car's frenet s jitter across the lap boundary -> lap_analyser spams
    # "lap completed 0.05s" every tick. NOTE per-map: switching maps needs
    # matching values (global_waypoints.json wpnt ~1 m in), or just re-place
    # the car with RViz 2D Pose Estimate.
    sx: 8.196
    sy: -10.216
    stheta: 1.156

    # opp starting pose on map (raceline point s=3.1 m, ~2 m ahead of ego)
    sx1: 9.395
    sy1: -8.749
    stheta1: 0.239

    # teleop
    kb_teleop: False
    drive_timeout_sec: 0.25
