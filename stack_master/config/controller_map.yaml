    t_clip_min: 1.7
    use_chord_cap: true
    trailing_gap: 1.5
    trailing_vel_gain: 0.25
    trailing_p_gain: 1.35
    trailing_i_gain: 0.0
    trailing_d_gain: 1.0
    blind_trailing_speed: 1.5
    heading_error_thres: 10.0
    steer_gain_for_speed: 1.0
    AEB_thres: 0.5
    speed_diff_thres: 0.1
    start_speed: 10.0
    start_curvature_factor: 1.5
    ftg_debug: true
    ftg_max_lidar_dist: 4.0
    ftg_max_speed: 2.0
    ftg_track_width: 2.0
    ftg_front_fov_deg: 100.0
    ftg_smooth_deg: 1.0
    ftg_disp_thresh: 0.7
    ftg_bubble_m: 0.3
    ftg_steer_ema: 0.0
    ftg_max_steer: 0.5
    use_map: true
    save_params: false
    ftg_prev_angle_penalty_gain: 0.6
    ftg_raceline_penalty_gain: 0.4
    ftg_raceline_lookahead_m: 1.0
    ftg_no_gap_speed: 1.2
    # Chu-Lee-Sunwoo (T-ITS 2012) off-road local path planner.
    offroad_plan_rate_hz: 20.0                 # 새 후보 경로를 생성·선택하는 주기 [Hz] (논문 구현 주기: 20 Hz)
    offroad_lateral_span_m: 2.0                # 후보 종점 q_f(d)의 전체 횡방향 탐색 폭 [m] (기본 -1.0~+1.0 m)
    offroad_lateral_resolution_m: 0.1          # 인접 후보 경로 종점 사이의 횡방향 간격 Δq [m]
    offroad_path_horizon_m: 6.0                # 각 후보 경로를 생성하고 충돌 검사하는 전방 s 길이 [m]
    offroad_path_resolution_m: 0.1             # 후보 경로를 이산화하는 종방향 s 샘플 간격 [m]
    offroad_speed_horizon_gain_s: 0.6          # 횡이동 완료 거리 식 Δs_f=k_v|v|+Δs_min의 속도 이득 k_v [s]
    offroad_min_maneuver_m: 1.5                # 횡이동을 완료하는 최소 종방향 거리 Δs_min [m]
    offroad_max_curvature: 1.55                # 비홀로노믹/조향 한계로 허용하는 후보 경로 최대 |곡률| [1/m]
    offroad_safety_sigma_m: 0.25               # 충돌 후보의 위험을 이웃 후보로 퍼뜨리는 Gaussian σ [m]
    offroad_safety_weight: 8.0                 # 총비용 J에서 안전 비용 C_S의 가중치 w_S
    offroad_smoothness_weight: 1.0             # 총비용 J에서 곡률 제곱 적분 비용 C_kappa의 가중치 w_kappa
    offroad_consistency_weight: 2.0            # 총비용 J에서 이전 선택 경로와의 일관성 비용 C_C 가중치 w_C
    offroad_vehicle_length_m: 0.54             # 경로 충돌 검사에 사용하는 차량 전체 길이 [m]
    offroad_vehicle_width_m: 0.31              # 경로 충돌 검사에 사용하는 차량 전체 폭 [m]
    offroad_collision_margin_m: 0.00           # 차량 footprint 사방에 추가하는 장애물 안전 여유 [m]
    offroad_road_margin_m: 0.03                # global waypoint의 d_left/d_right 경계에서 추가로 띄우는 여유 [m]
    offroad_scan_max_range_m: 8.0              # 로컬 장애물 셀 맵 구성에 사용할 최대 LiDAR 거리 [m]
    offroad_obstacle_cell_size_m: 0.05         # LiDAR 점을 중복 제거·양자화하는 장애물 셀 한 변의 길이 [m]
    offroad_lidar_offset_x_m: 0.27              # base_link 원점 기준 LiDAR의 전방(+)/후방(-) 위치 [m]
    offroad_lidar_offset_y_m: 0.0              # base_link 원점 기준 LiDAR의 좌측(+)/우측(-) 위치 [m]
    offroad_lidar_yaw_rad: 0.0                 # 차량 전방축에 대한 LiDAR 좌측(+) 회전각 [rad]
    offroad_max_lateral_accel_mps2: 3.0        # 곡률 속도 제한 v=sqrt(a_y,max/max|kappa|)의 최대 횡가속도 [m/s^2]
    offroad_safety_speed_gain: 0.7             # 안전 비용 기반 감속식 v_safe=(1-k_safe*C_S^2)v_curv의 k_safe
    offroad_max_speed_mps: 4.0                 # OFFROADONLY에서 허용하는 최종 목표 속도 상한 [m/s]
    offroad_emergency_speed_mps: 0.6           # 모든 후보가 충돌할 때 longest-free 후보의 속도 상한 [m/s]
    offroad_stop_distance_m: 0.45              # 선택 경로의 충돌 전 길이가 이 값 이하면 속도 0 명령 [m]
    offroad_wheelbase_m: 0.33                  # 선택 경로 Pure Pursuit 조향 계산에 쓰는 축거 [m]
    offroad_max_steer_rad: 0.47                # Pure Pursuit 최종 조향 명령의 절댓값 상한 [rad]
    offroad_lookahead_min_m: 0.6               # Pure Pursuit 최소 lookahead 거리 L_min [m]
    offroad_lookahead_speed_gain_s: 0.2        # lookahead 식 L=L_min+k_v|v|의 속도 이득 [s]
    offroad_use_waypoint_bounds: true          # true이면 global waypoint의 d_left/d_right 안으로 후보 경로를 제한
    # OVERTAKE L1 하한 섹터: [시작s, 끝s, t_clip_min] 3개 묶음, 여러 개 나열 가능
    ot_sectors: [0.0, 6.0, 0.9]
    # 장애물이 라이다에서 사라져 OVERTAKE가 풀린 뒤에도 짧은 L1을 유지하는 시간 [s]
    ot_l1_hold_sec: 1.0
    # 유지 시간이 끝난 뒤 t_clip_min까지 선형으로 되돌리는 시간 [s]
    ot_l1_release_sec: 1.5
