static_lattice_avoidance_planner:
  ros__parameters:
    # ========================================================================
    # 실행 및 디버그
    # ========================================================================
    measure: false              # true: /planner/avoidance/latency에 계산 시간 발행
    from_bag: false             # rosbag 재생 시 RViz 마커 표시 방식을 맞추는 옵션

    # ========================================================================
    # 장애물/트랙 hard safety margin
    # 후보가 이 제한을 어기면 비용과 관계없이 즉시 제거된다.
    # 아래 값은 모두 차량 중심에서 원본 경계까지 확보할 최종 거리이다.
    # 차량 폭과 별도 여유를 내부에서 추가하지 않고 이 상수를 그대로 쓴다.
    # ========================================================================
    lattice_track_boundary_margin: 0.25   # 차량 중심~트랙 경계 거리 [m]
    lattice_obstacle_boundary_margin: 0.30 # 차량 중심~장애물 경계 거리 [m]
    kernel_size: 5              # occupancy map 경계 erosion 크기; 클수록 보수적

    # ========================================================================
    # 장애물 선택 및 apex 샘플링
    # ========================================================================
    lattice_obstacle_horizon: 10.0   # 차량 전방에서 고려할 정적 장애물 거리 [m]
                                     # 3번째 장애물이 범위 밖이면 12~15 m 검토
    lattice_max_obstacles: 3         # 한 번에 처리할 최대 장애물 수; 구현상 최대 3
    lattice_d_resolution_three_samples: 0.20 # 3개 후보의 중앙 기준 횡간격 [m]
    lattice_d_resolution: 0.30       # 5개 후보의 중앙 기준 횡간격 [m]
    lattice_max_samples_per_side: 5  # 폭 규칙상 자유구간당 최대 후보 수
    lattice_min_free_width: 0.50     # 0.4m 미만 원본 자유공간에는 후보를 만들지 않음
                                     # 0.4~1.0m: 1개, 1.0~2.0m: 3개, 2.0m 이상: 5개
    lattice_longitudinal_margin: 0.40 # 충돌 검사 시 장애물 앞뒤 추가 여유 [m]

    # ========================================================================
    # 논문 기반 비용함수
    # J = w_safety*C_safety + w_smooth*C_curvature + w_consistency*C_previous
    # 세 가중치의 합을 1.0으로 맞추면 해석과 비교가 쉽다.
    lattice_weight_safety: 0.5      # 높을수록 장애물/트랙 경계에서 먼 경로 선호
    # ========================================================================
    lattice_weight_smoothness: 0.25   # 높을수록 곡률이 작고 완만한 spline 선호
    lattice_weight_consistency: 0.25 # 높을수록 이전 주기의 회피 방향/경로 유지

    lattice_safety_sigma: 0.2       # Gaussian 안전비용의 영향 거리 [m]
                                     # 높이면 장애물에서 더 일찍/멀리 떨어짐
    lattice_max_curvature: 1.8      # 허용 최대 절대 곡률 [1/m]
                                     # wheelbase 0.33 m, max steer 0.4 rad 기준
    lattice_consistency_scale: 0.50  # 이전 경로 차이를 정규화하는 횡거리 [m]
                                     # 낮을수록 경로 변경에 더 큰 비용 부여

    # ========================================================================
    # 마지막 장애물 통과 후 raceline 복귀
    # post_dist = clip(현재 위치~첫 장애물 거리, post_min_dist, post_max_dist)
    # 복귀점 = 마지막 장애물 apex의 s + post_dist, d=0
    # ========================================================================
    post_min_dist: 1.5          # 최소 복귀 거리 [m]; 급복귀 시 2.0 이상 검토
    post_max_dist: 5.0          # 최대 복귀 거리 [m]; 경로가 너무 길면 감소

    # true이면 lattice 최적경로 대신 기존 single-apex spline 출력을 사용한다.
    # 비교/비상 테스트용이며 정상 lattice 주행에서는 false로 유지한다.
    lattice_use_legacy_output: false
